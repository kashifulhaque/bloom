# Bloom on the VM. Install as ~/docs/apps/bloom/compose.yaml next to a .env
# file (chmod 600) that holds OPENROUTER_API_KEY=..., and for report share
# links BLOOM_SHARE_UPSTREAM=https://<ref>.supabase.co/functions/v1/report-share
# and BLOOM_SHARE_PROXY_SECRET=... (the same value as the function's secret). Caddy on the external
# `edge` network proxies bloom.ifkash.dev to bloom-web:8080. No ports are
# published on the host.
name: bloom

services:
  web:
    image: ghcr.io/kashifulhaque/bloom:latest
    container_name: bloom-web
    restart: unless-stopped
    env_file: .env
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
