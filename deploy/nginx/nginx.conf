# Main nginx config for the bloom-web container. Replaces the image's default.
# The server block is rendered at startup from templates/bloom.conf.template
# into /tmp/nginx/conf.d, so the root filesystem can be read-only.

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    types {
        text/javascript                          mjs;
        font/ttf                                 ttf;
        font/otf                                 otf;
        application/vnd.android.package-archive  apk;
    }
    default_type  application/octet-stream;

    # No query strings in the log: only the path, status, and size.
    log_format  bloom  '$remote_addr [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent $request_time';
    access_log  /dev/stdout  bloom;

    server_tokens  off;
    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout  65;

    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css text/javascript application/javascript
                       application/json application/manifest+json application/wasm
                       image/svg+xml font/ttf font/otf;

    include /tmp/nginx/conf.d/*.conf;
}
