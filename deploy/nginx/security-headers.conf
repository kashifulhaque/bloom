# Response headers for every location. nginx drops server-level add_header
# directives in any location that sets its own, so each location that adds a
# header includes this file again.
add_header Content-Security-Policy $bloom_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control $bloom_cache_control always;
