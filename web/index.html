<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the value of `flutter build --base-href`.
    It must start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloom is a free, open-source, offline period and cycle tracker. Your data stays on your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags and icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bloom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bloom — period &amp; cycle tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading splash in the Almanac style: ink on paper. Shown until Flutter
       paints its first frame. Colors match lib/theme/app_theme.dart. */
    :root { --paper: #F6F1E7; --ink: #2A2420; --ink2: #6E645A; --line: #E2D9C8; --ox: #A23B2A; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1A1714; --ink: #EFE7DA; --ink2: #A79C8D; --line: #3A342D; --ox: #E07A63; }
    }
    html, body { margin: 0; height: 100%; background: var(--paper); }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: var(--paper); color: var(--ink);
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    .mark { width: 76px; height: 76px; }
    .mark .petals { fill: none; stroke: var(--ox); stroke-width: 3; stroke-linejoin: round;
      stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s ease-out forwards; }
    .mark .stem { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw 1s .4s ease-out forwards; }
    .mark .eye { fill: var(--ox); opacity: 0; animation: show .4s 1s ease-out forwards; }
    .name { font: 400 26px/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -.01em; }
    .note { font: 500 10px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink2); }
    .rule { width: 120px; height: 1px; background: var(--line); position: relative; overflow: hidden; }
    .rule::after { content: ""; position: absolute; inset: 0; width: 36px; background: var(--ink2);
      animation: slide 1.6s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes show { to { opacity: 1; } }
    @keyframes slide { from { transform: translateX(-36px); } to { transform: translateX(120px); } }
    @media (prefers-reduced-motion: reduce) {
      .mark .petals, .mark .stem { animation: none; stroke-dashoffset: 0; }
      .mark .eye { animation: none; opacity: 1; }
      .rule::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading Bloom">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <path class="petals" d="M50.00 34.00Q63.00 21.00 50.00 10.00Q37.00 21.00 50.00 34.00ZM55.71 38.15Q72.09 46.49 78.53 30.73Q64.05 21.76 55.71 38.15ZM53.53 44.85Q50.65 63.01 67.63 64.27Q71.69 47.73 53.53 44.85ZM46.47 44.85Q28.31 47.73 32.37 64.27Q49.35 63.01 46.47 44.85ZM44.29 38.15Q35.95 21.76 21.47 30.73Q27.91 46.49 44.29 38.15Z"/>
      <circle class="eye" cx="50" cy="40" r="3.6"/>
      <path class="stem" d="M50 70Q47 82 51 96M49.5 86Q58 76 68 79Q60 88 49.5 86"/>
    </svg>
    <div class="name">Bloom</div>
    <div class="rule"></div>
    <div class="note">Your data stays on this device</div>
  </div>
  <script>
    // Fade the splash out once Flutter has painted.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
