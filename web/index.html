<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the value of `flutter build --base-href`.
    It must start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloom is a free, open-source, offline period and cycle tracker. Your data stays on your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF8F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17111A" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags and icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bloom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bloom — period &amp; cycle tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading splash: shown until Flutter paints its first frame. */
    :root { --bg: #FFF8F9; --ink: #6E5F70; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17111A; --ink: #C0B2C3; } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: var(--bg);
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); letter-spacing: .02em;
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    .bloom-mark {
      width: 84px; height: 84px; border-radius: 50%; position: relative;
      background: linear-gradient(135deg, #E23D74, #FF8A73);
      box-shadow: 0 14px 32px -10px rgba(226, 61, 116, .55);
      animation: breathe 1.8s ease-in-out infinite;
    }
    .bloom-mark svg { position: absolute; inset: 0; animation: spin 6s linear infinite; }
    .bloom-ring {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 3px solid rgba(232, 69, 122, .15); border-top-color: #E8457A;
      animation: spin 1.1s cubic-bezier(.5, .1, .5, .9) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) {
      .bloom-mark, .bloom-mark svg, .bloom-ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading Bloom">
    <div class="bloom-mark">
      <div class="bloom-ring"></div>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#fff">
          <ellipse cx="50" cy="36.5" rx="8.6" ry="13.4"/>
          <ellipse cx="50" cy="36.5" rx="8.6" ry="13.4" transform="rotate(72 50 50)"/>
          <ellipse cx="50" cy="36.5" rx="8.6" ry="13.4" transform="rotate(144 50 50)"/>
          <ellipse cx="50" cy="36.5" rx="8.6" ry="13.4" transform="rotate(216 50 50)"/>
          <ellipse cx="50" cy="36.5" rx="8.6" ry="13.4" transform="rotate(288 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="6.7" fill="#FFC2A8"/>
      </svg>
    </div>
    <div>Bloom</div>
  </div>
  <script>
    // Fade the splash out once Flutter has painted.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
